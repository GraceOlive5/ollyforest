<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="올리의 한글 숲">
<meta name="theme-color" content="#a8d8a8">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>">
<title>올리의 한글 숲 만들기 🌳</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Round+Square:wght@400;700;800&display=swap');
  :root {
    --gd:#2d6a4f; --gm:#52b788; --gl:#b7e4c7; --gp:#d8f3dc;
    --yw:#ffd166; --or:#f4a261; --rd:#e63946; --wh:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Jua',sans-serif;background:linear-gradient(160deg,#c8f0c7,#a8d8a8 40%,#7ec880);min-height:100vh;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;}

  /* BG */
  .bg-leaves{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden;}
  .bg-leaf{position:absolute;opacity:.18;animation:floatLeaf linear infinite;}
  @keyframes floatLeaf{0%{transform:translateY(-40px) rotate(0);opacity:0;}10%{opacity:.18;}90%{opacity:.18;}100%{transform:translateY(105vh) rotate(360deg);opacity:0;}}

  /* HEADER */
  .header{position:relative;z-index:10;width:100%;max-width:520px;padding:14px 16px 6px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .hbadge{display:flex;align-items:center;gap:6px;background:white;border-radius:20px;padding:6px 12px;box-shadow:0 3px 10px rgba(0,0,0,.1);font-size:.95rem;color:var(--gd);white-space:nowrap;}
  .htitle{flex:1;text-align:center;font-size:1rem;color:var(--gd);text-shadow:0 2px 0 rgba(255,255,255,.6);line-height:1.2;}

  /* DOTS */
  .progress-strip{position:relative;z-index:10;width:100%;max-width:520px;padding:0 16px 10px;}
  .consonant-dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;}
  .c-dot{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.5);border:2px solid rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;font-size:.78rem;color:var(--gd);transition:all .2s;}
  .c-dot.active{background:var(--yw);border-color:var(--or);transform:scale(1.15);box-shadow:0 2px 8px rgba(244,162,97,.5);}
  .c-dot.done{background:var(--gm);border-color:var(--gd);color:#fff;}

  /* CARD */
  .card{position:relative;z-index:10;width:calc(100% - 32px);max-width:480px;background:#fff;border-radius:28px;padding:20px;box-shadow:0 8px 32px rgba(45,106,79,.15),0 2px 8px rgba(0,0,0,.06);margin-bottom:16px;animation:cardIn .4s cubic-bezier(.34,1.56,.64,1);}
  @keyframes cardIn{from{transform:scale(.88) translateY(20px);opacity:0;}to{transform:scale(1) translateY(0);opacity:1;}}
  .card-title{text-align:center;font-size:1.05rem;color:var(--gd);margin-bottom:14px;}
  .card-title span{color:var(--or);font-size:1.25rem;}

  /* BUTTONS */
  .btn{display:block;width:100%;padding:13px;border:none;border-radius:16px;font-family:'Jua',sans-serif;font-size:1.05rem;cursor:pointer;transition:all .15s;}
  .btn:active{transform:scale(.96);}
  .btn-green{background:linear-gradient(135deg,var(--gm),var(--gd));color:#fff;box-shadow:0 4px 12px rgba(82,183,136,.4);}
  .btn-skip{background:var(--gp);color:var(--gd);font-size:.88rem;padding:9px;margin-top:8px;}
  .btn-order{background:#fff3e0;color:#c17800;font-size:.88rem;padding:9px;margin-top:8px;border:2px solid #ffe0a0;}

  /* WORD GRID */
  .word-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px;}
  .word-card{border-radius:18px;padding:14px 8px;background:linear-gradient(145deg,var(--gp),var(--gl));border:3px solid var(--gl);text-align:center;cursor:pointer;transition:all .2s;font-size:2rem;position:relative;}
  .word-card:hover,.word-card:active{transform:scale(1.07);border-color:var(--gm);}
  .word-card.done{opacity:.6;border-color:var(--gm);}
  .word-card .wlabel{font-size:.75rem;color:var(--gd);margin-top:4px;font-family:'Nanum Round Square',sans-serif;font-weight:700;}
  .word-card .chk{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--gm);color:#fff;font-size:.75rem;display:flex;align-items:center;justify-content:center;}
  .sec-label{font-size:.78rem;color:var(--gd);opacity:.6;text-align:center;margin-bottom:8px;font-family:'Nanum Round Square',sans-serif;}

  /* TRACE WRAP */
  .twrap{display:flex;flex-direction:column;align-items:center;gap:12px;}
  .cv-wrap{position:relative;width:200px;height:200px;}
  .cv-wrap canvas{position:absolute;top:0;left:0;border-radius:20px;}
  .draw-layer{touch-action:none;cursor:crosshair;z-index:2;}

  /* STROKE ORDER INDICATOR */
  .stroke-indicator{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;}
  .stroke-pip{width:34px;height:34px;border-radius:50%;border:2px solid var(--gl);background:var(--gp);display:flex;align-items:center;justify-content:center;font-size:.85rem;color:var(--gd);font-family:'Nanum Round Square',sans-serif;font-weight:800;transition:all .25s;}
  .stroke-pip.current{background:var(--yw);border-color:var(--or);transform:scale(1.15);box-shadow:0 2px 8px rgba(244,162,97,.5);}
  .stroke-pip.done{background:var(--gm);border-color:var(--gd);color:#fff;}
  .stroke-pip.locked{opacity:.35;}

  /* CHAR INDICATOR (word trace) */
  .wt-char-indicator{display:flex;gap:10px;justify-content:center;}
  .wt-char-dot{width:38px;height:38px;border-radius:50%;border:2px solid var(--gl);background:var(--gp);display:flex;align-items:center;justify-content:center;font-size:1rem;color:var(--gd);transition:all .2s;}
  .wt-char-dot.active{background:var(--yw);border-color:var(--or);transform:scale(1.12);}
  .wt-char-dot.done{background:var(--gm);border-color:var(--gd);color:#fff;}

  /* COVERAGE */
  .cov-wrap{width:200px;}
  .cov-label{font-size:.8rem;color:#888;font-family:'Nanum Round Square',sans-serif;margin-bottom:4px;text-align:center;}
  .cov-bg{width:100%;height:14px;border-radius:8px;background:#e8f5e9;overflow:hidden;}
  .cov-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--gl),var(--gm));transition:width .15s ease;}
  .cov-fill.pass{background:linear-gradient(90deg,#52b788,#2d6a4f);}

  /* RESULT BADGE */
  .result-badge{font-size:1.25rem;padding:10px 22px;border-radius:20px;display:none;animation:popB .3s cubic-bezier(.34,1.56,.64,1);}
  .result-badge.success{background:#e8f8e8;color:var(--gd);display:block;}
  .result-badge.order-fail{background:#fff8e0;color:#c17800;display:block;}
  @keyframes popB{from{transform:scale(.5);}to{transform:scale(1);}}

  /* SCORE POPUP */
  .score-popup{position:fixed;z-index:100;top:50%;left:50%;transform:translate(-50%,-60%) scale(.5);background:#fff;border-radius:24px;padding:18px 30px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.2);font-size:1.3rem;color:var(--gd);pointer-events:none;opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1);}
  .score-popup.show{transform:translate(-50%,-60%) scale(1);opacity:1;}

  /* FOREST */
  .forest-section{position:relative;z-index:10;width:calc(100% - 32px);max-width:480px;background:linear-gradient(180deg,#e8f5e9,#c8f0c7);border-radius:28px;padding:18px;box-shadow:0 4px 20px rgba(45,106,79,.1);margin-bottom:20px;}
  .forest-title{text-align:center;color:var(--gd);font-size:.95rem;margin-bottom:10px;}
  .leaf-progress{display:flex;gap:6px;justify-content:center;margin-bottom:12px;}
  .leaf-slot{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.5);border:2px dashed var(--gm);display:flex;align-items:center;justify-content:center;font-size:1.1rem;transition:all .3s cubic-bezier(.34,1.56,.64,1);}
  .leaf-slot.filled{background:var(--gl);border:2px solid var(--gm);animation:popL .4s cubic-bezier(.34,1.56,.64,1);}
  @keyframes popL{from{transform:scale(0);}to{transform:scale(1);}}
  .land-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  .land-plot{aspect-ratio:1;border-radius:10px;background:linear-gradient(160deg,#a8d8a8,#7ec880);border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:1.4rem;}
  .land-plot.has-tree{background:linear-gradient(160deg,#52b788,#2d6a4f);}
  .land-plot.new-tree{animation:treeG .6s cubic-bezier(.34,1.56,.64,1);}
  @keyframes treeG{0%{transform:scale(0) rotate(-20deg);}60%{transform:scale(1.2) rotate(5deg);}100%{transform:scale(1) rotate(0);}}

  /* FAIRY */
  .fairy-overlay{position:fixed;inset:0;z-index:200;background:rgba(45,106,79,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;}
  .fairy-overlay.show{opacity:1;pointer-events:all;}
  .fairy-box{background:#fff;border-radius:32px;padding:28px;text-align:center;max-width:300px;width:90%;box-shadow:0 16px 60px rgba(0,0,0,.2);animation:fIn .5s cubic-bezier(.34,1.56,.64,1);}
  @keyframes fIn{from{transform:scale(.6) translateY(40px);}to{transform:scale(1) translateY(0);}}
  .fairy-emoji{font-size:3.5rem;margin-bottom:10px;animation:bounce 1s ease-in-out infinite;}
  @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
  .fairy-text{font-size:1.1rem;color:var(--gd);margin-bottom:16px;line-height:1.6;}

  .confetti-piece{position:fixed;z-index:300;border-radius:2px;pointer-events:none;animation:cFall 1.5s ease-in forwards;}
  @keyframes cFall{0%{transform:translateY(-20px) rotate(0);opacity:1;}100%{transform:translateY(100vh) rotate(720deg);opacity:0;}}
  .hidden{display:none!important;}

  /* TAB NAV */
  .tab-nav{position:relative;z-index:10;display:flex;gap:8px;width:calc(100% - 32px);max-width:480px;margin-bottom:4px;}
  .tab-btn{flex:1;padding:10px 0;border:none;border-radius:16px;font-family:'Jua',sans-serif;font-size:1rem;cursor:pointer;transition:all .2s;background:rgba(255,255,255,.5);color:var(--gd);}
  .tab-btn.active{background:white;box-shadow:0 3px 12px rgba(45,106,79,.15);color:var(--gd);font-size:1.05rem;}
  .tab-btn.done-tab{background:rgba(82,183,136,.25);color:var(--gd);}

  /* VOWEL DOTS */
  .vowel-dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;}
  .v-dot{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.5);border:2px solid rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;font-size:.78rem;color:var(--gd);transition:all .2s;}
  .v-dot.active{background:var(--yw);border-color:var(--or);transform:scale(1.15);box-shadow:0 2px 8px rgba(244,162,97,.5);}
  .v-dot.done{background:var(--gm);border-color:var(--gd);color:#fff;}

  /* shake animation for wrong order */
  @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-6px);}80%{transform:translateX(6px);}}
  .shake{animation:shake .4s ease;}
</style>
</head>
<body>
<div class="bg-leaves" id="bgLeaves"></div>

<!-- HEADER: ⭐ left | title center | 🍃 right -->
<div class="header">
  <div class="hbadge">⭐ <span id="totalScore">0</span></div>
  <div class="htitle">올리의<br>한글 숲 만들기 🌳</div>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
    <div class="hbadge">🍃 <span id="leafCountHeader">0</span><span style="color:#ccc;font-size:.8rem"> /7</span></div>
    <button onclick="resetProgress()" style="background:none;border:none;font-size:.7rem;color:rgba(45,106,79,.45);cursor:pointer;font-family:'Jua',sans-serif;padding:0;">처음부터</button>
  </div>
</div>

<div class="tab-nav">
  <button class="tab-btn active" id="tabBtnCon" onclick="switchTab('con')">📝 자음</button>
  <button class="tab-btn" id="tabBtnVow" onclick="switchTab('vow')">🎵 모음</button>
</div>
<div class="progress-strip" id="conProgress"><div class="consonant-dots" id="consonantDots"></div></div>
<div class="progress-strip hidden" id="vowProgress"><div class="vowel-dots" id="vowelDots"></div></div>

<!-- P1: CONSONANT TRACE with stroke order -->
<div class="card" id="phaseTrace">
  <div class="card-title" id="traceCardTitle">자음 쓰기: <span id="currentConsonant">ㄱ</span></div>
  <div class="twrap">
    <div class="stroke-indicator" id="strokeIndicator"></div>
    <div class="cv-wrap">
      <canvas id="traceBg" width="200" height="200"></canvas>
      <canvas id="traceCanvas" class="draw-layer" width="200" height="200"></canvas>
    </div>
    <div class="cov-wrap">
      <div class="cov-label" id="cCovLabel">획 1을 써 보세요</div>
      <div class="cov-bg"><div class="cov-fill" id="cCovFill" style="width:0%"></div></div>
    </div>
    <div class="result-badge" id="cResultBadge"></div>
    <button class="btn btn-green hidden" id="btnTraceDone" onclick="finishTrace()">단어 배우기 →</button>
    <button class="btn btn-order" id="btnTraceOrder" onclick="retryCurrentStroke()">순서에 맞춰요! ✏️</button>
    <button class="btn btn-skip" onclick="finishTrace()">건너뛰기</button>
  </div>
</div>

<!-- P2: WORD PICK -->
<div class="card hidden" id="phaseWords">
  <div class="card-title" id="wordSectionTitle"><span id="wordConsonant">ㄱ</span>으로 시작하는 단어!</div>
  <div class="sec-label">그림을 눌러서 단어를 써 보세요 👆</div>
  <div class="word-grid" id="wordGrid"></div>
  <div style="text-align:center;color:#bbb;font-size:.8rem;font-family:'Nanum Round Square',sans-serif;" id="wordProgressLabel"></div>
</div>

<!-- P3: WORD TRACE -->
<div class="card hidden" id="phaseWordTrace">
  <div class="card-title" id="wordTraceTitle">단어 따라쓰기</div>
  <div class="twrap">
    <div class="wt-char-indicator" id="wtCharIndicator"></div>
    <div class="cv-wrap" id="wtCanvasWrap">
      <canvas id="wtBgCanvas" width="200" height="200"></canvas>
      <canvas id="wtDrawCanvas" class="draw-layer" width="200" height="200"></canvas>
    </div>
    <div class="cov-wrap">
      <div class="cov-label" id="wCovLabel">글자를 따라 써 보세요</div>
      <div class="cov-bg"><div class="cov-fill" id="wCovFill" style="width:0%"></div></div>
    </div>
    <div class="result-badge" id="wResultBadge"></div>
    <button class="btn btn-green hidden" id="btnNextChar" onclick="nextCharOrFinish()">다음 글자 →</button>
    <button class="btn btn-skip" onclick="skipWordTrace()">건너뛰기</button>
  </div>
</div>

<!-- FOREST -->
<div class="forest-section">
  <div class="forest-title">🌿 나뭇잎 모으기</div>
  <div class="leaf-progress" id="leafProgress"></div>
  <div class="forest-title">🌱 내 땅</div>
  <div class="land-grid" id="landGrid"></div>
</div>

<div class="score-popup" id="scorePopup">⭐ +1점!</div>

<div class="fairy-overlay" id="fairyOverlay">
  <div class="fairy-box">
    <div class="fairy-emoji">🧚</div>
    <div class="fairy-text">나뭇잎 7개를 모았어요!<br>나무 요정이 나무를 심어줄게요! 🌳</div>
    <button class="btn btn-green" onclick="closeFairy()">고마워요!</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  STROKE ORDER DATA
//  각 획은 canvas path 함수 배열. 획 번호 순서대로만 채점함.
//  fn(ctx, S) — S = canvas size (200)
// ═══════════════════════════════════════════════════════════════
const STROKES = {
  // ㄱ: 1획 — 가로→꺾어 아래
  'ㄱ':[ (c,s)=>{c.moveTo(s*.2,s*.26);c.lineTo(s*.78,s*.26);c.lineTo(s*.78,s*.78);} ],

  // ㄴ: 1획 — 아래→오른 꺾기
  'ㄴ':[ (c,s)=>{c.moveTo(s*.24,s*.2);c.lineTo(s*.24,s*.76);c.lineTo(s*.78,s*.76);} ],

  // ㄷ: 2획 — ①위가로(왼→오른)  ②ㄴ(세로→아래가로)
  // 이미지: 위가로는 왼쪽에서 오른쪽으로
  'ㄷ':[
    (c,s)=>{c.moveTo(s*.22,s*.22);c.lineTo(s*.78,s*.22);},
    (c,s)=>{c.moveTo(s*.22,s*.22);c.lineTo(s*.22,s*.78);c.lineTo(s*.78,s*.78);},
  ],

  // ㄹ: 3획
  'ㄹ':[
    (c,s)=>{c.moveTo(s*.22,s*.22);c.lineTo(s*.78,s*.22);c.lineTo(s*.78,s*.5);},
    (c,s)=>{c.moveTo(s*.22,s*.5);c.lineTo(s*.78,s*.5);},
    (c,s)=>{c.moveTo(s*.22,s*.5);c.lineTo(s*.22,s*.78);c.lineTo(s*.78,s*.78);},
  ],

  // ㅁ: 3획 — ①왼세로  ②위가로→오른세로  ③아래가로
  'ㅁ':[
    (c,s)=>{c.moveTo(s*.22,s*.22);c.lineTo(s*.22,s*.78);},
    (c,s)=>{c.moveTo(s*.24,s*.22);c.lineTo(s*.78,s*.22);c.lineTo(s*.78,s*.78);},
    (c,s)=>{c.moveTo(s*.22,s*.78);c.lineTo(s*.78,s*.78);},
  ],

  // ㅂ: 4획 — 이미지: ①왼세로 ②오른세로 ③위가로(짧게, 두 세로 사이) ④중간가로
  // 글자 모양: 위에 짧은 가로, 아래에 긴 가로, 양쪽 세로
  'ㅂ':[
    (c,s)=>{c.moveTo(s*.26,s*.24);c.lineTo(s*.26,s*.78);},           // ①왼세로
    (c,s)=>{c.moveTo(s*.74,s*.24);c.lineTo(s*.74,s*.78);},           // ②오른세로
    (c,s)=>{c.moveTo(s*.26,s*.24);c.lineTo(s*.74,s*.24);},           // ③위가로(두 세로 연결)
    (c,s)=>{c.moveTo(s*.26,s*.54);c.lineTo(s*.74,s*.54);},           // ④중간가로
  ],

  // ㅅ: 2획
  'ㅅ':[
    (c,s)=>{c.moveTo(s*.5,s*.18);c.lineTo(s*.18,s*.82);},
    (c,s)=>{c.moveTo(s*.5,s*.18);c.lineTo(s*.82,s*.82);},
  ],

  // ㅇ: 1획
  'ㅇ':[ (c,s)=>{c.arc(s*.5,s*.52,s*.3,-Math.PI/2,Math.PI*1.5);} ],

  // ㅈ: 이미지 참고 — ①가로(왼→오른)  ②왼아래획  ③오른아래획
  // 이미지에서 가로가 꺾여서 내려오는 모양: 가로→왼꺾기 한 획, 오른아래획 한 획 = 2획
  'ㅈ':[
    (c,s)=>{c.moveTo(s*.2,s*.32);c.lineTo(s*.8,s*.32);c.lineTo(s*.2,s*.82);},  // ①가로→왼아래꺾기
    (c,s)=>{c.moveTo(s*.5,s*.32);c.lineTo(s*.82,s*.82);},                       // ②오른아래획
  ],

  // ㅊ: 이미지 참고 — ①위짧은가로(점)  ②가로→왼아래꺾기  ③오른아래획
  'ㅊ':[
    (c,s)=>{c.moveTo(s*.38,s*.12);c.lineTo(s*.62,s*.12);},                      // ①위점
    (c,s)=>{c.moveTo(s*.2,s*.34);c.lineTo(s*.8,s*.34);c.lineTo(s*.2,s*.84);},  // ②가로→왼아래꺾기
    (c,s)=>{c.moveTo(s*.5,s*.34);c.lineTo(s*.82,s*.84);},                       // ③오른아래획
  ],

  // ㅋ: 2획 — ①위가로→꺾기(ㄱ 끝까지)  ②중간가로(오른세로에 붙음)
  'ㅋ':[
    (c,s)=>{c.moveTo(s*.2,s*.26);c.lineTo(s*.78,s*.26);c.lineTo(s*.78,s*.78);},

    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  } catch(e){}
}

function loadState(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    const data = JSON.parse(raw);
    st.tab   = data.tab   || 'con';
    st.cIdx  = data.cIdx  || 0;
    st.vIdx  = data.vIdx  || 0;
    st.score = data.score || 0;
    st.leaves= data.leaves|| 0;
    st.trees = data.trees || [];
    totalWords = data.totalWords || 0;
    document.getElementById('totalScore').textContent = st.score;
  } catch(e){}
}

function resetProgress(){
  if(!confirm('처음부터 다시 시작할까요? 모든 진행상황이 지워져요! 🌱')) return;
  localStorage.removeItem(SAVE_KEY);
  location.reload();
}

// ═══ INIT ════════════════════════════════════════════════════════
function init(){
  loadState();
  buildBg();buildDots();buildLeaves();buildLand();
  // 탭 UI 상태 복원
  document.getElementById('tabBtnCon').classList.toggle('active', st.tab==='con');
  document.getElementById('tabBtnVow').classList.toggle('active', st.tab==='vow');
  document.getElementById('conProgress').classList.toggle('hidden', st.tab==='vow');
  document.getElementById('vowProgress').classList.toggle('hidden', st.tab==='con');
  renderPhase();
}

function buildBg(){
  const c=document.getElementById('bgLeaves');
  ['🍃','🌿','🍀','🌱'].forEach(em=>{for(let j=0;j<4;j++){
    const d=document.createElement('div');d.className='bg-leaf';d.textContent=em;
    d.style.left=(Math.random()*100)+'%';d.style.fontSize=(0.9+Math.random()*1.2)+'rem';
    d.style.animationDuration=(8+Math.random()*12)+'s';d.style.animationDelay=(Math.random()*16)+'s';
    c.appendChild(d);}});
}
function buildDots(){
  const c=document.getElementById('consonantDots');c.innerHTML='';
  CONSONANTS.forEach((con,i)=>{
    const d=document.createElement('div');
    d.className='c-dot'+(i===st.cIdx?' active':(i<st.cIdx?' done':''));
    d.textContent=con;
    d.style.cursor='pointer';
    d.title=con+' 으로 이동';
    d.onclick=()=>jumpTo('con',i);
    c.appendChild(d);
  });
  const v=document.getElementById('vowelDots');v.innerHTML='';
  VOWELS.forEach((vow,i)=>{
    const d=document.createElement('div');
    d.className='v-dot'+(i===st.vIdx?' active':(i<st.vIdx?' done':''));
    d.textContent=vow;
    d.style.cursor='pointer';
    d.title=vow+' 으로 이동';
    d.onclick=()=>jumpTo('vow',i);
    v.appendChild(d);
  });
}

function jumpTo(tab, idx){
  // 탭 전환
  if(st.tab!==tab){
    st.tab=tab;
    document.getElementById('tabBtnCon').classList.toggle('active',tab==='con');
    document.getElementById('tabBtnVow').classList.toggle('active',tab==='vow');
    document.getElementById('conProgress').classList.toggle('hidden',tab==='vow');
    document.getElementById('vowProgress').classList.toggle('hidden',tab==='con');
  }
  // 인덱스 이동
  if(tab==='con') st.cIdx=idx;
  else st.vIdx=idx;
  st.phase='trace'; st.wordsDone=[];
  buildDots(); renderPhase();
}
function buildLeaves(){
  const c=document.getElementById('leafProgress');c.innerHTML='';
  for(let i=0;i<7;i++){const s=document.createElement('div');s.className='leaf-slot'+(i<st.leaves?' filled':'');s.textContent=i<st.leaves?'🍃':'';c.appendChild(s);}
  document.getElementById('leafCountHeader').textContent=st.leaves;
}
function buildLand(){
  const g=document.getElementById('landGrid');g.innerHTML='';
  for(let i=0;i<20;i++){const p=document.createElement('div');p.className='land-plot'+(st.trees.includes(i)?' has-tree':'');p.textContent=st.trees.includes(i)?'🌳':'🌱';g.appendChild(p);}
}

// ═══ TAB SWITCH ══════════════════════════════════════════════════
function switchTab(tab){
  st.tab=tab;
  document.getElementById('tabBtnCon').classList.toggle('active', tab==='con');
  document.getElementById('tabBtnVow').classList.toggle('active', tab==='vow');
  document.getElementById('conProgress').classList.toggle('hidden', tab==='vow');
  document.getElementById('vowProgress').classList.toggle('hidden', tab==='con');
  st.phase='trace'; st.wordsDone=[];
  buildDots(); renderPhase();
}

// ═══ PHASE RENDER ════════════════════════════════════════════════
function renderPhase(){
  ['phaseTrace','phaseWords','phaseWordTrace'].forEach(id=>document.getElementById(id).classList.add('hidden'));

  if(st.tab==='con'){
    const con=CONSONANTS[st.cIdx];
    if(st.phase==='trace'){
      document.getElementById('traceCardTitle').innerHTML='자음 쓰기: <span style="color:var(--or);font-size:1.25rem">'+con+'</span>';
      document.getElementById('phaseTrace').classList.remove('hidden');
      initConsonantTrace(con);
    } else if(st.phase==='words'){
      document.getElementById('wordSectionTitle').innerHTML='<span style="color:var(--or)">'+con+'</span>으로 시작하는 단어!';
      document.getElementById('phaseWords').classList.remove('hidden');
      renderWordGrid();
    } else {
      document.getElementById('phaseWordTrace').classList.remove('hidden');
      initWordTrace();
    }
  } else {
    // VOWEL TAB
    const vow=VOWELS[st.vIdx];
    if(st.phase==='trace'){
      document.getElementById('traceCardTitle').innerHTML='모음 쓰기: <span style="color:var(--or);font-size:1.25rem">'+vow+'</span>';
      document.getElementById('phaseTrace').classList.remove('hidden');
      initVowelTrace(vow);
    } else if(st.phase==='words'){
      document.getElementById('wordSectionTitle').innerHTML='<span style="color:var(--or)">'+vow+'</span> 가 들어간 단어!';
      document.getElementById('phaseWords').classList.remove('hidden');
      renderWordGrid();
    } else {
      document.getElementById('phaseWordTrace').classList.remove('hidden');
      initWordTrace();
    }
  }
}

// ═══════════════════════════════════════════════════════════════
//  STROKE ORDER ENGINE
//  Handles both consonant and word-char tracing
// ═══════════════════════════════════════════════════════════════

/* Build pixel mask for a single stroke path fn */
function buildStrokeMask(fn, sz){
  const off=document.createElement('canvas');off.width=sz;off.height=sz;
  const ctx=off.getContext('2d');
  ctx.strokeStyle='black';ctx.lineWidth=SW+EXPAND*2;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();fn(ctx,sz);ctx.stroke();
  // also draw "core" with just SW
  ctx.lineWidth=SW;
  ctx.beginPath();fn(ctx,sz);ctx.stroke();
  const d=off.getContext('2d').getImageData(0,0,sz,sz).data;
  const mask=new Uint8Array(sz*sz);
  for(let i=0;i<sz*sz;i++) if(d[i*4+3]>30) mask[i]=1;
  return mask;
}

/* Draw all strokes (as dashed guides) on bg canvas, highlight current */
function drawStrokesBg(ctx, strokes, currentIdx, completedIdxs, sz){
  ctx.clearRect(0,0,sz,sz);
  // background
  ctx.fillStyle='#f0faf2';rr(ctx,0,0,sz,sz,20);ctx.fill();
  // grid dots
  ctx.fillStyle='#cde8d4';
  for(let x=25;x<sz;x+=25) for(let y=25;y<sz;y+=25){ctx.beginPath();ctx.arc(x,y,1.5,0,Math.PI*2);ctx.fill();}

  strokes.forEach((fn,i)=>{
    ctx.save();
    if(completedIdxs.includes(i)){
      // completed: solid green
      ctx.strokeStyle='rgba(82,183,136,0.7)';ctx.lineWidth=SW+2;ctx.lineCap='round';ctx.lineJoin='round';
      ctx.setLineDash([]);
    } else if(i===currentIdx){
      // current: bright dashed
      ctx.strokeStyle='#f4a261';ctx.lineWidth=SW+4;ctx.lineCap='round';ctx.lineJoin='round';
      ctx.setLineDash([10,7]);
    } else {
      // future: faint dashed
      ctx.strokeStyle='rgba(180,220,190,0.5)';ctx.lineWidth=SW;ctx.lineCap='round';ctx.lineJoin='round';
      ctx.setLineDash([6,6]);
    }
    ctx.beginPath();fn(ctx,sz);ctx.stroke();
    ctx.restore();

    // draw number at stroke start
    if(!completedIdxs.includes(i)){
      const pos=getStrokeStartPos(fn,sz);
      // 각 번호를 획 인덱스에 따라 방향 분산: 0=왼상, 1=오른상, 2=왼하, 3=오른하
      const dirs=[{x:-14,y:-14},{x:14,y:-14},{x:-14,y:14},{x:14,y:14}];
      const dir=dirs[i]||{x:0,y:-14};
      const bx=Math.max(12,Math.min(sz-12, pos.x+dir.x));
      const by=Math.max(12,Math.min(sz-12, pos.y+dir.y));
      ctx.save();
      ctx.beginPath();ctx.arc(bx,by,11,0,Math.PI*2);
      ctx.fillStyle=i===currentIdx?'#f4a261':'rgba(180,210,180,0.7)';ctx.fill();
      ctx.fillStyle=i===currentIdx?'white':'rgba(60,120,60,0.8)';
      ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(i+1,bx,by);ctx.restore();
    }
  });
}

/* Estimate stroke start position by evaluating fn on a mini canvas */
function getStrokeStartPos(fn,sz){
  // default fallback
  let px=sz*.2,py=sz*.2;
  try{
    const tmp=document.createElement('canvas');tmp.width=sz;tmp.height=sz;
    const tc=tmp.getContext('2d');
    // intercept moveTo
    let captured=false;
    const orig=tc.moveTo.bind(tc);
    tc.moveTo=(x,y)=>{if(!captured){px=x;py=y;captured=true;}orig(x,y);};
    fn(tc,sz);
  }catch(e){}
  return {x:px,y:py};
}

/* Build stroke indicator pips */
function buildStrokePips(containerId, strokes, currentIdx, completedIdxs){
  const c=document.getElementById(containerId);c.innerHTML='';
  strokes.forEach((_,i)=>{
    const d=document.createElement('div');
    let cls='stroke-pip';
    if(completedIdxs.includes(i)) cls+=' done';
    else if(i===currentIdx) cls+=' current';
    else cls+=' locked';
    d.className=cls;d.textContent=i+1;c.appendChild(d);
  });
}

/* Calc coverage of current stroke */
function calcStrokeCoverage(drawCv, mask){
  if(!drawCv||!mask) return 0;
  const userPx=drawCv.getContext('2d').getImageData(0,0,S,S).data;
  const userMap=new Uint8Array(S*S);
  for(let i=0;i<S*S;i++) if(userPx[i*4+3]>20) userMap[i]=1;
  // dilate user map by EXPAND and AND with mask
  let tot=0,cov=0;
  const R=EXPAND;
  for(let y=0;y<S;y++) for(let x=0;x<S;x++){
    if(!mask[y*S+x]) continue;
    tot++;
    const x0=Math.max(0,x-R),x1=Math.min(S-1,x+R);
    const y0=Math.max(0,y-R),y1=Math.min(S-1,y+R);
    let hit=0;
    outer:for(let yy=y0;yy<=y1;yy++) for(let xx=x0;xx<=x1;xx++) if(userMap[yy*S+xx]){hit=1;break outer;}
    if(hit) cov++;
  }
  return tot?cov/tot:0;
}

// ═══ CONSONANT TRACE ════════════════════════════════════════════
let conStrokes=[], conStrokeIdx=0, conStrokeDone=[], conDrawCv=null;

function initConsonantTrace(con){
  conStrokes=STROKES[con]||[];
  conStrokeIdx=0; conStrokeDone=[];

  resetConUI();
  buildStrokePips('strokeIndicator', conStrokes, 0, []);

  // bg canvas
  const bgCv=document.getElementById('traceBg');
  drawStrokesBg(bgCv.getContext('2d'), conStrokes, 0, [], S);

  // fresh draw canvas
  const old=document.getElementById('traceCanvas');
  const fresh=freshCanvas('traceCanvas','draw-layer');
  old.parentNode.replaceChild(fresh,old);
  conDrawCv=fresh; st.drawCvEl=fresh;

  attachStrokeDrawing(
    fresh,
    ()=>onConStroke(),
    ()=>buildStrokeMask(conStrokes[conStrokeIdx], S),
    ()=>document.getElementById('phaseTrace').querySelector('.cv-wrap')
  );
}

function resetConUI(msg){
  document.getElementById('cCovLabel').textContent=msg||'획 1을 써 보세요';
  document.getElementById('cCovFill').style.width='0%';
  document.getElementById('cCovFill').classList.remove('pass');
  document.getElementById('cResultBadge').className='result-badge';
  document.getElementById('cResultBadge').textContent='';
  document.getElementById('btnTraceDone').classList.add('hidden');
  document.getElementById('btnTraceOrder').classList.remove('hidden');
}

function onConStroke(){
  const strokes=conStrokes;
  if(conStrokeIdx>=strokes.length) return;
  // check WRONG zone: did user draw where they shouldn't yet?
  const mask=buildStrokeMask(strokes[conStrokeIdx],S);
  const pct=calcStrokeCoverage(conDrawCv, mask);
  const p100=Math.round(pct*100);

  document.getElementById('cCovFill').style.width=Math.min(100,p100)+'%';
  document.getElementById('cCovLabel').textContent=`획 ${conStrokeIdx+1} — ${Math.min(100,p100)}% 채워짐`;

  if(pct>=PASS){
    // stroke passed!
    conStrokeDone.push(conStrokeIdx);
    conStrokeIdx++;
    if(conStrokeIdx>=strokes.length){
      // all strokes done
      document.getElementById('cCovFill').classList.add('pass');
      const b=document.getElementById('cResultBadge');
      b.className='result-badge success'; b.textContent='🎉 완성!';
      document.getElementById('btnTraceDone').classList.remove('hidden');
      document.getElementById('btnTraceOrder').classList.add('hidden');
    } else {
      // next stroke
      const bgCv=document.getElementById('traceBg');
      drawStrokesBg(bgCv.getContext('2d'),strokes,conStrokeIdx,conStrokeDone,S);
      buildStrokePips('strokeIndicator',strokes,conStrokeIdx,conStrokeDone);
      document.getElementById('cCovFill').classList.add('pass');
      // clear only current layer, keep old for reference
      conDrawCv.getContext('2d').clearRect(0,0,S,S);
      document.getElementById('cCovFill').style.width='0%';
      document.getElementById('cCovFill').classList.remove('pass');
      document.getElementById('cCovLabel').textContent=`획 ${conStrokeIdx+1}을 써 보세요`;
    }
  }
  buildStrokePips('strokeIndicator',strokes,conStrokeIdx,conStrokeDone);
}

function retryCurrentStroke(){
  if(conDrawCv) conDrawCv.getContext('2d').clearRect(0,0,S,S);
  document.getElementById('cCovFill').style.width='0%';
  document.getElementById('cCovFill').classList.remove('pass');
  document.getElementById('cCovLabel').textContent=`획 ${conStrokeIdx+1}을 써 보세요`;
  // shake
  const wrap=document.getElementById('phaseTrace').querySelector('.cv-wrap');
  wrap.classList.remove('shake');void wrap.offsetWidth;wrap.classList.add('shake');
}

function finishTrace(){
  st.phase='words'; st.wordsDone=[]; renderPhase(); buildDots();
}

// ─── 모음 따라쓰기 초기화 (자음과 동일한 canvas 재활용) ───
function initVowelTrace(vow){
  conStrokes=VOWEL_STROKES[vow]||[];
  conStrokeIdx=0; conStrokeDone=[];
  resetConUI(`획 1을 써 보세요`);
  buildStrokePips('strokeIndicator', conStrokes, 0, []);
  const bgCv=document.getElementById('traceBg');
  drawStrokesBg(bgCv.getContext('2d'), conStrokes, 0, [], S);
  const old=document.getElementById('traceCanvas');
  const fresh=freshCanvas('traceCanvas','draw-layer');
  old.parentNode.replaceChild(fresh,old);
  conDrawCv=fresh; st.drawCvEl=fresh;
  attachStrokeDrawing(
    fresh,
    ()=>onConStroke(),
    ()=>buildStrokeMask(conStrokes[conStrokeIdx], S),
    ()=>document.getElementById('phaseTrace').querySelector('.cv-wrap')
  );
}

// ═══ WORD GRID ════════════════════════════════════════════════
function renderWordGrid(){
  const wordMap = st.tab==='con' ? WORDS : VOWEL_WORDS;
  const key = st.tab==='con' ? CONSONANTS[st.cIdx] : VOWELS[st.vIdx];
  const words=(wordMap[key]||[]).slice(0,3);
  const grid=document.getElementById('wordGrid');grid.innerHTML='';
  words.forEach((w,i)=>{
    const done=st.wordsDone.includes(i);
    const card=document.createElement('div');
    card.className='word-card'+(done?' done':'');
    card.innerHTML=`<div>${w.e}</div><div class="wlabel">${w.w}</div>`+(done?'<div class="chk">✓</div>':'');
    if(!done) card.onclick=()=>pickWord(i,w);
    grid.appendChild(card);
  });
  document.getElementById('wordProgressLabel').textContent=`${st.wordsDone.length} / 3 완료`;
  if(st.wordsDone.length>=3) setTimeout(nextStep,800);
}

function pickWord(idx,word){
  st.cwIdx=idx;st.cWord=word;st.charIdx=0;st.charsPassed=[];st.phase='wordTrace';renderPhase();
}

// ═══ WORD TRACE (simple coverage — no stroke order) ═════════════
let wDrawCv=null;

function initWordTrace(){
  const word=st.cWord, chars=word.w.split('');
  document.getElementById('wordTraceTitle').innerHTML=`<span style="font-size:1.5rem">${word.e}</span> <span style="color:var(--or)">${word.w}</span> 따라쓰기`;
  // char dots
  const ind=document.getElementById('wtCharIndicator');ind.innerHTML='';
  chars.forEach((ch,i)=>{
    const d=document.createElement('div');d.id=`wdot${i}`;
    d.className='wt-char-dot'+(i===st.charIdx?' active':(st.charsPassed.includes(i)?' done':''));
    d.textContent=ch;ind.appendChild(d);
  });
  renderWordChar();
}

function renderWordChar(){
  const chars=st.cWord.w.split('');
  const ch=chars[st.charIdx];

  // 단어 따라쓰기 = 획순 없이 전체 채우기
  resetWordCharUI(ch);

  // bg: 글자 가이드만
  drawWordCharBgSimple(document.getElementById('wtBgCanvas').getContext('2d'),ch,S);

  // fresh draw canvas
  const old=document.getElementById('wtDrawCanvas');
  const fresh=freshCanvas('wtDrawCanvas','draw-layer');
  old.parentNode.replaceChild(fresh,old);
  wDrawCv=fresh;

  attachSimpleDrawing(fresh, ch);
}

function resetWordCharUI(ch){
  document.getElementById('wCovLabel').textContent='글자를 따라 써 보세요';
  document.getElementById('wCovFill').style.width='0%';
  document.getElementById('wCovFill').classList.remove('pass');
  document.getElementById('wResultBadge').className='result-badge';
  document.getElementById('wResultBadge').textContent='';
  document.getElementById('btnNextChar').classList.add('hidden');
}

/* drawWordCharBgSimple: 획순 없이 가이드만 표시 */
function drawWordCharBgSimple(bctx,ch,sz){
  bctx.clearRect(0,0,sz,sz);
  bctx.fillStyle='#f0faf2';rr(bctx,0,0,sz,sz,20);bctx.fill();
  bctx.fillStyle='#cde8d4';
  for(let x=25;x<sz;x+=25) for(let y=25;y<sz;y+=25){bctx.beginPath();bctx.arc(x,y,1.5,0,Math.PI*2);bctx.fill();}
  // dashed guide
  bctx.save();bctx.setLineDash([6,5]);bctx.strokeStyle='#9ad4ae';bctx.lineWidth=SW+8;bctx.lineCap='round';bctx.lineJoin='round';
  bctx.font=`bold ${sz*.76}px 'Jua',sans-serif`;bctx.textAlign='center';bctx.textBaseline='middle';
  bctx.strokeText(ch,sz/2,sz/2+4);bctx.restore();
  // faint fill
  bctx.save();bctx.globalAlpha=0.10;bctx.fillStyle='#2d6a4f';
  bctx.font=`bold ${sz*.76}px 'Jua',sans-serif`;bctx.textAlign='center';bctx.textBaseline='middle';
  bctx.fillText(ch,sz/2,sz/2+4);bctx.restore();
}

/* Simple drawing attachment — coverage check on pen lift, auto-pass at PASS% */
function attachSimpleDrawing(cv, ch){
  const old=document.getElementById('wtDrawCanvas');
  // cv is already fresh, just need to attach
  const ctx=cv.getContext('2d');
  ctx.strokeStyle='#2d6a4f';ctx.lineWidth=SW;ctx.lineCap='round';ctx.lineJoin='round';
  wDrawCv=cv;
  let dn=false;
  function gp(e){const r=cv.getBoundingClientRect(),sx=cv.width/r.width,sy=cv.height/r.height;
    return e.touches?{x:(e.touches[0].clientX-r.left)*sx,y:(e.touches[0].clientY-r.top)*sy}:{x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy};}
  function sd(e){e.preventDefault();dn=true;const p=gp(e);ctx.beginPath();ctx.moveTo(p.x,p.y);}
  function sm(e){if(!dn)return;e.preventDefault();const p=gp(e);ctx.lineTo(p.x,p.y);ctx.stroke();}
  function se(){
    if(!dn)return;dn=false;
    requestAnimationFrame(()=>{
      // build full-char mask
      const mask=buildFullCharMask(ch,S);
      const pct=calcStrokeCoverage(cv,mask);
      const p100=Math.round(Math.min(100,pct*100));
      document.getElementById('wCovFill').style.width=p100+'%';
      document.getElementById('wCovLabel').textContent=p100+'% 채워짐';
      if(pct>=PASS){
        document.getElementById('wCovFill').classList.add('pass');
        const b=document.getElementById('wResultBadge');
        if(!b.classList.contains('success')){
          b.className='result-badge success';b.textContent='🎉 완성!';
          document.getElementById('btnNextChar').classList.remove('hidden');
        }
      }
    });
  }
  cv.addEventListener('mousedown',sd);cv.addEventListener('mousemove',sm);cv.addEventListener('mouseup',se);
  cv.addEventListener('touchstart',sd,{passive:false});cv.addEventListener('touchmove',sm,{passive:false});cv.addEventListener('touchend',se);
}

/* Full char mask for simple coverage */
function buildFullCharMask(ch,sz){
  const off=document.createElement('canvas');off.width=sz;off.height=sz;
  const ctx=off.getContext('2d');
  ctx.font=`bold ${sz*.76}px 'Jua',sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='black';ctx.fillText(ch,sz/2,sz/2+4);
  ctx.strokeStyle='black';ctx.lineWidth=SW+EXPAND*2;ctx.lineCap='round';ctx.strokeText(ch,sz/2,sz/2+4);
  const d=ctx.getImageData(0,0,sz,sz).data;
  const mask=new Uint8Array(sz*sz);
  for(let i=0;i<sz*sz;i++) if(d[i*4+3]>20) mask[i]=1;
  return mask;
}

function nextCharOrFinish(){
  const chars=st.cWord.w.split('');
  st.charsPassed.push(st.charIdx);st.charIdx++;
  if(st.charIdx>=chars.length){wordDone();return;}
  chars.forEach((_,i)=>{
    const d=document.getElementById(`wdot${i}`);
    if(d) d.className='wt-char-dot'+(i===st.charIdx?' active':(st.charsPassed.includes(i)||i<st.charIdx?' done':''));
  });
  renderWordChar();
}

function wordDone(){
  st.wordsDone.push(st.cwIdx);st.score++;totalWords++;
  document.getElementById('totalScore').textContent=st.score;
  showScorePopup();
  if(totalWords%12===0) setTimeout(giveLeaf,600);
  st.phase='words';renderPhase();
}

function skipWordTrace(){st.wordsDone.push(st.cwIdx);st.phase='words';renderPhase();}

function nextStep(){
  st.wordsDone=[];
  if(st.tab==='con'){
    if(st.cIdx<CONSONANTS.length-1){
      st.cIdx++;
      st.phase='trace'; saveState(); buildDots(); renderPhase();
    } else {
      st.cIdx=0;
      switchTab('vow');
    }
  } else {
    if(st.vIdx<VOWELS.length-1){
      st.vIdx++;
      st.phase='trace'; saveState(); buildDots(); renderPhase();
    } else {
      st.vIdx=0;
      switchTab('con');
    }
  }
}
// keep old name for compat
function nextConsonant(){ nextStep(); }

// ═══ DRAWING ATTACHMENT ═════════════════════════════════════════
// getMaskFn: ()=>Uint8Array — current stroke mask for auto-erase check
// getWrapEl: ()=>DOM element — element to shake on wrong stroke
function attachStrokeDrawing(cv, onStrokeEnd, getMaskFn, getWrapEl){
  let dn=false;
  const ctx=cv.getContext('2d');
  ctx.strokeStyle='#2d6a4f';ctx.lineWidth=SW;ctx.lineCap='round';ctx.lineJoin='round';
  let snapshot=null;

  function gp(e){const r=cv.getBoundingClientRect(),sx=cv.width/r.width,sy=cv.height/r.height;
    return e.touches?{x:(e.touches[0].clientX-r.left)*sx,y:(e.touches[0].clientY-r.top)*sy}:{x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy};}
  function sd(e){
    e.preventDefault();dn=true;
    snapshot=ctx.getImageData(0,0,S,S); // save before stroke
    const p=gp(e);ctx.beginPath();ctx.moveTo(p.x,p.y);
  }
  function sm(e){if(!dn)return;e.preventDefault();const p=gp(e);ctx.lineTo(p.x,p.y);ctx.stroke();}
  function se(){
    if(!dn)return;dn=false;
    if(!rafPending){
      rafPending=true;
      requestAnimationFrame(()=>{
        rafPending=false;
        const mask=getMaskFn?getMaskFn():null;
        if(mask){
          const pct=calcStrokeCoverage(cv,mask);
          if(pct<PASS){
            // ❌ 획이 틀림 — 지우고 흔들기
            if(snapshot) ctx.putImageData(snapshot,0,0);
            const wrap=getWrapEl?getWrapEl():null;
            if(wrap){wrap.classList.remove('shake');void wrap.offsetWidth;wrap.classList.add('shake');}
            return;
          }
        }
        onStrokeEnd();
      });
    }
  }

  cv.addEventListener('mousedown',sd);cv.addEventListener('mousemove',sm);cv.addEventListener('mouseup',se);
  cv.addEventListener('touchstart',sd,{passive:false});cv.addEventListener('touchmove',sm,{passive:false});cv.addEventListener('touchend',se);
}

// ═══ SCORE / LEAF / TREE ════════════════════════════════════════
function showScorePopup(){const p=document.getElementById('scorePopup');p.classList.add('show');setTimeout(()=>p.classList.remove('show'),900);saveState();}
function giveLeaf(){if(st.leaves<7){st.leaves++;buildLeaves();saveState();}if(st.leaves>=7)setTimeout(()=>document.getElementById('fairyOverlay').classList.add('show'),400);}
function closeFairy(){document.getElementById('fairyOverlay').classList.remove('show');plantTree();st.leaves=0;buildLeaves();}
function plantTree(){
  for(let i=0;i<20;i++){if(!st.trees.includes(i)){
    st.trees.push(i);buildLand();saveState();
    setTimeout(()=>{const p=document.querySelectorAll('.land-plot');if(p[i])p[i].classList.add('new-tree');},100);
    confetti();break;}}
}
function confetti(){
  const cols=['#52b788','#ffd166','#f4a261','#ffb3c6','#90e0ef','#b7e4c7'];
  for(let i=0;i<30;i++) setTimeout(()=>{
    const c=document.createElement('div');c.className='confetti-piece';
    c.style.left=(20+Math.random()*60)+'%';c.style.top='20%';
    c.style.background=cols[Math.floor(Math.random()*cols.length)];
    c.style.width=(6+Math.random()*10)+'px';c.style.height=(6+Math.random()*10)+'px';
    c.style.borderRadius=Math.random()>.5?'50%':'2px';c.style.animationDuration=(1+Math.random())+'s';
    document.body.appendChild(c);setTimeout(()=>c.remove(),2000);
  },i*40);
}

// ═══ UTIL ════════════════════════════════════════════════════════
function freshCanvas(id,cls){const c=document.createElement('canvas');c.id=id;c.className=cls;c.width=S;c.height=S;return c;}
function rr(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

init();
